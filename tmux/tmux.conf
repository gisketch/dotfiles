# Fix Colors
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# Change Prefix to Ctrl+a (easier to reach)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Quality of Life
set -g mouse on
set -g base-index 1          # Start windows at 1
set -g pane-base-index 1     # Start panes at 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# New window & pane creation (prefix + arrows/enter)
unbind c
bind c new-window -c "#{pane_current_path}"
bind Enter new-window -c "#{pane_current_path}"
unbind Left
unbind Up
unbind Right
unbind Down
bind Left split-window -hb -c "#{pane_current_path}"
bind Up split-window -vb -c "#{pane_current_path}"
bind Right split-window -h -c "#{pane_current_path}"
bind Down split-window -v -c "#{pane_current_path}"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'aserowy/tmux.nvim'

# tmux.nvim keybindings (match nvim arrow-key workflow)
set -g @tmux-nvim-navigation true
set -g @tmux-nvim-navigation-cycle true
set -g @tmux-nvim-navigation-keybinding-left 'C-Left'
set -g @tmux-nvim-navigation-keybinding-down 'C-Down'
set -g @tmux-nvim-navigation-keybinding-up 'C-Up'
set -g @tmux-nvim-navigation-keybinding-right 'C-Right'
set -g @tmux-nvim-resize true
set -g @tmux-nvim-resize-step-x 30
set -g @tmux-nvim-resize-step-y 30
set -g @tmux-nvim-resize-keybinding-left 'C-S-Left'
set -g @tmux-nvim-resize-keybinding-down 'C-S-Down'
set -g @tmux-nvim-resize-keybinding-up 'C-S-Up'
set -g @tmux-nvim-resize-keybinding-right 'C-S-Right'

unbind C-Left
unbind C-Down
unbind C-Up
unbind C-Right
bind -r C-Left resize-pane -L 30
bind -r C-Down resize-pane -D 30
bind -r C-Up resize-pane -U 30
bind -r C-Right resize-pane -R 30

# Seamless tmux window switching from shell or nvim
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|n?vim?x?)(-wrapped)?(diff)?$'"
unbind-key -n C-Left
unbind-key -n C-Down
unbind-key -n C-Up
unbind-key -n C-Right
bind-key -n 'C-Left' if-shell "$is_vim" 'send-keys C-Left' { if -F '#{pane_at_left}' '' 'select-pane -L' }
bind-key -n 'C-Down' if-shell "$is_vim" 'send-keys C-Down' { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind-key -n 'C-Up' if-shell "$is_vim" 'send-keys C-Up' { if -F '#{pane_at_top}' '' 'select-pane -U' }
bind-key -n 'C-Right' if-shell "$is_vim" 'send-keys C-Right' { if -F '#{pane_at_right}' '' 'select-pane -R' }
bind-key -T copy-mode-vi 'C-Left' if -F '#{pane_at_left}' '' 'select-pane -L'
bind-key -T copy-mode-vi 'C-Down' if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key -T copy-mode-vi 'C-Up' if -F '#{pane_at_top}' '' 'select-pane -U'
bind-key -T copy-mode-vi 'C-Right' if -F '#{pane_at_right}' '' 'select-pane -R'
bind-key -n 'C-S-Left' if-shell "$is_vim" 'send-keys C-S-Left' 'resize-pane -L 30'
bind-key -n 'C-S-Down' if-shell "$is_vim" 'send-keys C-S-Down' 'resize-pane -D 30'
bind-key -n 'C-S-Up' if-shell "$is_vim" 'send-keys C-S-Up' 'resize-pane -U 30'
bind-key -n 'C-S-Right' if-shell "$is_vim" 'send-keys C-S-Right' 'resize-pane -R 30'
bind-key -n 'C-,' if-shell "$is_vim" 'send-keys C-,' 'select-window -p'
bind-key -n 'C-.' if-shell "$is_vim" 'send-keys C-.' 'select-window -n'
bind-key -T copy-mode-vi 'C-,' select-window -p
bind-key -T copy-mode-vi 'C-.' select-window -n

# Monochrome Focus status theme (aligned with nvim/lua/themes/monochromefocus.lua)
set -g status-style "bg=#151515,fg=#d4d4d4"
set -g message-style "bg=#262626,fg=#d4d4d4"
set -g mode-style "bg=#262626,fg=#d4d4d4"
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#737373"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#0d0d0d,bg=#a3a3a3,bold]  #S #[fg=#a3a3a3,bg=#151515] "
set -g window-status-format "#[fg=#737373,bg=#262626] 󱂬 #I #W "
set -g window-status-current-format "#[fg=#0d0d0d,bg=#d4d4d4,bold] 󰆍 #I #W "
set -g status-right "#[fg=#8a8a8a,bg=#151515]#[fg=#0d0d0d,bg=#8a8a8a] 󰃭 %a %d %b %H:%M "
# Enable xterm keys for Ctrl/Alt + Arrow sequences
set-window-option -g xterm-keys on

# Ensure terminal supports 256 colors (important for sequence parsing)
set -g default-terminal "xterm-256color"

# Initialize TMUX plugin manager (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
